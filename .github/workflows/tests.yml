name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package
        run: python -m pip install -e ".[demo]"
      - name: Run fast tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: |
          python -m pip install build
          python -m build
